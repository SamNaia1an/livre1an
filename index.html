 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre année</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <div class="hero-eyebrow">le livre, en vrai</div>
  <h1>Notre année</h1>
  <p class="sub">Chaque dessin du livre est né d'une vraie photo. Ici, ce sont ces photos-là — page par page, telles qu'on les a vécues.</p>
  <div class="count"><span class="num" id="hero-count">–</span><span class="label">pages à<br>découvrir</span></div>
  <div class="scroll-hint">↓ choisis une page ↓</div>
</section>

<nav class="pagebar">
  <div class="pagebar-inner" id="pagebar"></div>
</nav>

<main class="pages" id="pages"></main>

<footer class="site-footer">fait avec amour · pour nos ans ♡</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <div class="lightbox-content" id="lightbox-content"></div>
</div>

<script src="script.js"></script>
</body>
</html>
