<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sam &amp; Naia - Notre annee</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap");

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

:root {
  --cream: #f7f0e2;
  --cream-deep: #efe2c8;
  --paper: #fbf6ec;
  --ink: #4a3626;
  --ink-soft: #7a6248;
  --gold: #b8934f;
  --gold-deep: #8f6f34;
  --line: rgba(184, 147, 79, 0.35);
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: "Jost", sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}

h1, h2, .serif { font-family: "Cormorant Garamond", serif; }

/* ---------- Hero ---------- */

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  padding: 8vh 6vw;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(184,147,79,0.10), transparent 60%),
    var(--cream);
}

.hero::before, .hero::after {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  height: 1px;
  background: var(--line);
}
.hero::before { top: 7%; }
.hero::after { bottom: 7%; }

.hero-title-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(1rem, 4vw, 2.6rem);
}

.hero-avatar {
  flex: 0 0 auto;
  height: clamp(140px, 26vw, 280px);
  display: flex;
  align-items: flex-end;
}
.hero-avatar img {
  height: 100%;
  width: auto;
  object-fit: contain;
  display: block;
}

@media (max-width: 520px) {
  .hero-avatar { height: 110px; }
}

.hero-title-center {
  display: flex;
  flex-direction: column;
  align-items: center;
}

@media (max-width: 520px) {
  .hero-avatar { width: 58px; height: 58px; }
}

.heart-badge {
  position: relative;
  width: 7.2rem;
  height: 6.4rem;
  margin-bottom: 2.2rem;
}
.heart-badge svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.heart-badge svg path {
  fill: none;
  stroke: var(--gold);
  stroke-width: 2.5;
}
.heart-badge span {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 0.3rem;
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 1.15rem;
  color: var(--gold-deep);
  letter-spacing: 0.02em;
}

.hero h1 {
  font-size: clamp(2.4rem, 7vw, 4rem);
  font-style: italic;
  font-weight: 500;
  margin: 0;
  color: var(--gold-deep);
}

.hero p.sub {
  margin-top: 1.4rem;
  max-width: 30rem;
  font-size: 1rem;
  line-height: 1.7;
  color: var(--ink-soft);
}

.hero .count {
  margin-top: 2.2rem;
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}
.hero .count .num {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 2.6rem;
  color: var(--gold);
}
.hero .count .label {
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  text-transform: uppercase;
}

.hero .scroll-hint {
  position: absolute;
  bottom: 3.2rem;
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
  text-transform: uppercase;
}

/* ---------- Nav strip ---------- */

.pagebar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(247, 240, 226, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.pagebar-inner {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0.9rem 1.2rem;
  -webkit-overflow-scrolling: touch;
}
.pagebar-inner::-webkit-scrollbar { height: 3px; }
.pagebar-inner::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

.page-btn {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-soft);
  font-family: "Jost", sans-serif;
  font-size: 0.85rem;
  padding: 0.45rem 0.9rem;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.page-btn:hover { border-color: var(--gold); color: var(--ink); }
.page-btn.active { background: var(--gold); border-color: var(--gold); color: var(--paper); }

/* ---------- Page sections ---------- */

.pages { max-width: 1100px; margin: 0 auto; padding: 3rem 1.2rem 7rem; }

.page-section { display: none; }
.page-section.active { display: block; animation: fadein 0.4s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.page-head {
  display: flex;
  align-items: baseline;
  gap: 0.9rem;
  margin-bottom: 1.6rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 1rem;
}
.page-head .num { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 2.3rem; color: var(--gold-deep); }
.page-head .of { font-size: 0.75rem; letter-spacing: 0.1em; color: var(--ink-soft); text-transform: uppercase; }

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0.8rem;
}

.tile {
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  background: var(--cream-deep);
  cursor: pointer;
  aspect-ratio: 4 / 5;
  border: 1px solid var(--line);
}
.tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.tile:hover img, .tile:hover video { transform: scale(1.03); }
.tile.video::after {
  content: "\25B6";
  position: absolute; bottom: 0.55rem; left: 0.55rem;
  font-size: 0.65rem; background: rgba(74,54,38,0.75); color: var(--paper);
  width: 1.6rem; height: 1.6rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; padding-left: 2px;
}

.empty-page {
  text-align: center; padding: 4.5rem 1.4rem;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--paper);
}
.empty-page .glyph { font-size: 2.2rem; margin-bottom: 1.1rem; }
.empty-page p { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.6rem; max-width: 28rem; margin: 0 auto; line-height: 1.5; color: var(--ink); }

.soon-page { text-align: center; padding: 4rem 1.4rem; border: 1px dashed var(--line); border-radius: 8px; }
.soon-page p { font-size: 0.9rem; color: var(--ink-soft); letter-spacing: 0.02em; }

/* ---------- Lightbox ---------- */

.lightbox {
  position: fixed; inset: 0; background: rgba(30, 20, 12, 0.92);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 4vh 4vw;
}
.lightbox.open { display: flex; }
.lightbox-content img, .lightbox-content video {
  max-width: 92vw; max-height: 88vh; border-radius: 4px; display: block;
}
.lightbox-close {
  position: absolute; top: 1.4rem; right: 1.6rem; font-size: 1.5rem;
  color: var(--paper); background: none; border: none; cursor: pointer; opacity: 0.85;
}

/* ---------- Footer ---------- */

.site-footer { text-align: center; padding: 2.2rem 1rem 3rem; font-size: 0.74rem; letter-spacing: 0.06em; color: var(--ink-soft); }

@media (max-width: 560px) {
  .gallery { grid-template-columns: repeat(2, 1fr); gap: 0.55rem; }
  .page-head .num { font-size: 1.9rem; }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-title-row">
    <div class="hero-avatar"><img src="avatar-sam.png" alt="Sam"></div>
    <div class="hero-title-center">
      <div class="heart-badge">
        <svg viewBox="0 0 100 88" preserveAspectRatio="xMidYMid meet"><path d="M50 82 C 18 58, 4 38, 4 21 C 4 7, 17 -1, 30 4 C 40 8, 47 15, 50 23 C 53 15, 60 8, 70 4 C 83 -1, 96 7, 96 21 C 96 38, 82 58, 50 82 Z"/></svg>
        <span>1 an</span>
      </div>
      <h1>Sam &amp; Naia</h1>
    </div>
    <div class="hero-avatar"><img src="avatar-naia.png" alt="Naia"></div>
  </div>
  <p class="sub">Chaque dessin du livre est né d’une vraie photo. Ici, ce sont ces photos-là, page par page, telles qu’on les a vécues.</p>
  <div class="count"><span class="num" id="hero-count">.</span><span class="label">pages à<br>découvrir</span></div>
  <div class="scroll-hint">choisis une page ci-dessous</div>
</section>

<nav class="pagebar"><div class="pagebar-inner" id="pagebar"></div></nav>

<main class="pages" id="pages"></main>

<footer class="site-footer">Fait pour Naia, pour que tu te rappelles toujours de cette première année &#9825;</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">X</button>
  <div class="lightbox-content" id="lightbox-content"></div>
</div>

<script>

ge", "file": "page12/image4.jpg"}, {"type": "image", "file": "page12/image5.jpg"}, {"type": "image", "file": "page12/image7.jpg"}, {"type": "video", "file": "page12/video3.mp4"}, {"type": "video", "file": "page12/video6.mp4"}], "13": [{"type": "image", "file": "page13/image4.jpg"}, {"type": "image", "file": "page13/image5.jpg"}, {"type": "image", "file": "page13/image7.jpg"}, {"type": "image", "file": "page13/image9.jpg"}, {"type": "image", "file": "page13/image10.jpg"}, {"type": "video", "file": "page13/video6.mov"}, {"type": "video", "file": "page13/video8.mov"}, {"type": "video", "file": "page13/video1.mp4"}, {"type": "video", "file": "page13/video2.mp4"}, {"type": "video", "file": "page13/video3.mp4"}], "14": [{"type": "image", "file": "page14/image1.jpg"}, {"type": "image", "file": "page14/image2.jpg"}, {"type": "image", "file": "page14/image3.jpg"}, {"type": "image", "file": "page14/image5.jpg"}, {"type": "video", "file": "page14/video6.mov"}, {"type": "video", "file": "page14/video4.mp4"}], "15": [{"type": "video", "file": "page15/video1.mp4"}], "16": [{"type": "image", "file": "page16/image6.jpg"}, {"type": "image", "file": "page16/image7.jpg"}, {"type": "image", "file": "page16/image8.jpg"}, {"type": "image", "file": "page16/image9.jpg"}, {"type": "image", "file": "page16/image10.jpg"}, {"type": "image", "file": "page16/image11.jpg"}, {"type": "image", "file": "page16/image12.jpg"}, {"type": "video", "file": "page16/video1.mp4"}, {"type": "video", "file": "page16/video2.mp4"}, {"type": "video", "file": "page16/video3.mp4"}, {"type": "video", "file": "page16/video4.mp4"}, {"type": "video", "file": "page16/video5.mp4"}, {"type": "video", "file": "page16/video13.mp4"}], "17": [{"type": "image", "file": "page17/image1.jpg"}, {"type": "image", "file": "page17/image3.jpg"}, {"type": "image", "file": "page17/image4.jpg"}, {"type": "image", "file": "page17/image5.jpg"}, {"type": "image", "file": "page17/image10.jpg"}, {"type": "image", "file": "page17/image11.jpg"}, {"type": "image", "file": "page17/image12.jpg"}, {"type": "image", "file": "page17/image13.jpg"}, {"type": "image", "file": "page17/image14.jpg"}, {"type": "image", "file": "page17/image16.jpg"}, {"type": "image", "file": "page17/image17.jpg"}, {"type": "image", "file": "page17/image18.jpg"}, {"type": "image", "file": "page17/image19.jpg"}, {"type": "image", "file": "page17/image20.jpg"}, {"type": "image", "file": "page17/image21.jpg"}, {"type": "video", "file": "page17/video9.mov"}, {"type": "video", "file": "page17/video2.mp4"}, {"type": "video", "file": "page17/video6.mp4"}, {"type": "video", "file": "page17/video7.mp4"}, {"type": "video", "file": "page17/video8.mp4"}, {"type": "video", "file": "page17/video15.mp4"}], "18": [{"type": "image", "file": "page18/image1.jpg"}, {"type": "image", "file": "page18/image2.jpg"}, {"type": "image", "file": "page18/image3.jpg"}, {"type": "image", "file": "page18/image4.jpg"}, {"type": "image", "file": "page18/image5.jpg"}, {"type": "image", "file": "page18/image6.jpg"}, {"type": "video", "file": "page18/video7.mp4"}, {"type": "video", "file": "page18/video8.mp4"}, {"type": "video", "file": "page18/video9.mp4"}, {"type": "video", "file": "page18/video10.mp4"}, {"type": "video", "file": "page18/video11.mp4"}, {"type": "video", "file": "page18/video12.mp4"}, {"type": "video", "file": "page18/video13.mp4"}, {"type": "video", "file": "page18/video14.mp4"}, {"type": "video", "file": "page18/video15.mp4"}, {"type": "video", "file": "page18/video16.mp4"}, {"type": "video", "file": "page18/video17.mp4"}, {"type": "video", "file": "page18/video18.mp4"}], "19": [{"type": "image", "file": "page19/image1.jpg"}, {"type": "image", "file": "page19/image3.jpg"}, {"type": "image", "file": "page19/image5.jpg"}, {"type": "image", "file": "page19/image9.jpg"}, {"type": "image", "file": "page19/image10.jpg"}, {"type": "image", "file": "page19/image11.jpg"}, {"type": "video", "file": "page19/video2.mp4"}, {"type": "video", "file": "page19/video4.mp4"}, {"type": "video", "file": "page19/video6.mp4"}, {"type": "video", "file": "page19/video7.mp4"}, {"type": "video", "file": "page19/video8.mp4"}]};
var TOTAL_PAGES = 25;
var EXCLUDED = [3];

function initSite() {
  var pagebar = document.getElementById("pagebar");
  var pagesRoot = document.getElementById("pages");
  var heroCount = document.getElementById("hero-count");

  var availablePages = Object.keys(MANIFEST).map(Number).sort(function(a,b){ return a-b; });
  heroCount.textContent = availablePages.length;

  for (var n = 1; n <= TOTAL_PAGES; n++) {
    if (EXCLUDED.indexOf(n) !== -1) continue;

    var btn = document.createElement("button");
    btn.className = "page-btn";
    btn.textContent = n;
    btn.setAttribute("data-page", n);
    btn.addEventListener("click", (function(num){ return function(){ goToPage(num); }; })(n));
    pagebar.appendChild(btn);

    var section = document.createElement("section");
    section.className = "page-section";
    section.id = "page-" + n;

    var head = document.createElement("div");
    head.className = "page-head";
    head.innerHTML = "<span class=\"num\">" + n + "</span><span class=\"of\">page " + n + " / " + TOTAL_PAGES + "</span>";
    section.appendChild(head);

    var items = MANIFEST[n];

    if (n === 1 && !items) {
      var empty = document.createElement("div");
      empty.className = "empty-page";
      empty.innerHTML = "<div class=\"glyph\">&#129327;&#129526;</div><p>Désolé, on n’a pas pris de photo... on avait trop froid !</p>";
      section.appendChild(empty);
    } else if (items && items.length) {
      var gallery = document.createElement("div");
      gallery.className = "gallery";
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var tile = document.createElement("div");
        tile.className = "tile" + (item.type === "video" ? " video" : "");
        if (item.type === "image") {
          tile.innerHTML = "<img src=\"" + item.file + "\" loading=\"lazy\" alt=\"Souvenir page " + n + "\">";
        } else {
          tile.innerHTML = "<video src=\"" + item.file + "#t=0.5\" preload=\"metadata\" muted playsinline></video>";
        }
        tile.addEventListener("click", (function(it){ return function(){ openLightbox(it); }; })(item));
        gallery.appendChild(tile);
      }
      section.appendChild(gallery);
    } else {
      var soon = document.createElement("div");
      soon.className = "soon-page";
      soon.innerHTML = "<p>Cette page arrive bientôt</p>";
      section.appendChild(soon);
    }

    pagesRoot.appendChild(section);
  }

  function goToPage(n) {
    var btns = document.querySelectorAll(".page-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("active", Number(btns[i].getAttribute("data-page")) === n);
    }
    var secs = document.querySelectorAll(".page-section");
    for (var j = 0; j < secs.length; j++) {
      secs[j].classList.toggle("active", secs[j].id === "page-" + n);
    }
    var activeBtn = document.querySelector(".page-btn[data-page=\"" + n + "\"]");
    if (activeBtn) activeBtn.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    history.replaceState(null, "", "#page" + n);
  }

  var lightbox = document.getElementById("lightbox");
  var lightboxContent = document.getElementById("lightbox-content");

  function openLightbox(item) {
    if (item.type === "image") {
      lightboxContent.innerHTML = "<img src=\"" + item.file + "\" alt=\"\">";
    } else {
      lightboxContent.innerHTML = "<video src=\"" + item.file + "\" controls autoplay playsinline></video>";
    }
    lightbox.classList.add("open");
  }
  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxContent.innerHTML = "";
  }
  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", function(e){ if (e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeLightbox(); });

  var hashMatch = location.hash.match(/#page(\d+)/);
  var startPage = hashMatch ? Number(hashMatch[1]) : availablePages[0];
  goToPage(startPage);
}

initSite();
</script>
